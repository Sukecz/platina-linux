name: Offline project checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install host tools for screen integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ python3-pil fonts-dejavu-core
      - name: Validate sources and run offline tests
        run: make check
